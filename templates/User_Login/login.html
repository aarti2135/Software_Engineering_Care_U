{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CareU · Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
          --primary: #007AFF;
          --secondary: #5856D6;
          --bg-primary: #FFFFFF;
          --bg-secondary: #F2F2F7;
          --text-primary: #1C1C1E;
          --text-secondary: #8E8E93;
          --border: #E5E5EA;
          --card-radius: 18px;
        }

        body {
          margin: 0;
          padding: 0;
          font-family: 'Inter', sans-serif;
          background: var(--bg-secondary);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .login-wrapper {
          width: 100%;
          max-width: 420px;
          padding: 1.5rem;
        }

        .login-card {
          background: var(--bg-primary);
          border-radius: var(--card-radius);
          box-shadow: 0 18px 45px rgba(0,0,0,0.08);
          padding: 2.25rem 2.5rem;
        }

        .brand-badge {
          width: 52px;
          height: 52px;
          border-radius: 16px;
          background: linear-gradient(135deg, var(--primary), var(--secondary));
          display: flex;
          align-items: center;
          justify-content: center;
          color: #fff;
          font-weight: 700;
          font-size: 1.4rem;
          margin-bottom: 1rem;
        }

        .login-title {
          font-weight: 700;
          color: var(--text-primary);
        }

        .login-subtitle {
          color: var(--text-secondary);
          font-size: 0.95rem;
        }

        .form-label {
          font-weight: 500;
          color: var(--text-primary);
          font-size: 0.9rem;
        }

        .form-control {
          border-radius: 10px;
          border-color: var(--border);
          font-size: 0.95rem;
          padding: 0.7rem 0.9rem;
        }

        .form-control:focus {
          border-color: var(--primary);
          box-shadow: 0 0 0 3px rgba(0,122,255,0.18);
        }

        .btn-login {
          border-radius: 12px;
          background: var(--primary);
          border: none;
          font-weight: 600;
          padding: 0.7rem 1.2rem;
          width: 100%;
          box-shadow: 0 8px 18px rgba(0,122,255,0.28);
        }

        .btn-login:hover {
          background: #005FCC;
        }

        .signup-text {
          font-size: 0.9rem;
          color: var(--text-secondary);
        }

        .signup-text a {
          color: var(--primary);
          font-weight: 500;
          text-decoration: none;
        }

        .signup-text a:hover {
          text-decoration: underline;
        }

        .alert {
          font-size: 0.85rem;
          border-radius: 10px;
        }

        @media (max-width: 576px) {
          .login-card {
            padding: 1.75rem 1.5rem;
          }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

      <!-- Brand / title -->
      <div class="d-flex align-items-center mb-3">
          <div class="brand-badge">
              CU
          </div>
          <div class="ms-2">
              <h4 class="login-title mb-0">Welcome to CareU</h4>
              <p class="login-subtitle mb-0">Sign in to access your health dashboard.</p>
          </div>
      </div>

      <!-- Django messages -->
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} mb-3">
              {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <!-- Login form -->
      <form method="post" action="{% url 'User_Login:login' %}" class="mt-3">
          {% csrf_token %}

          <div class="mb-3">
              <label for="id_username" class="form-label">Username</label>
              <input type="text" id="id_username" name="username" class="form-control" placeholder="Enter your username" required>
          </div>

          <div class="mb-3">
              <label for="id_password" class="form-label">Password</label>
              <input type="password" id="id_password" name="password" class="form-control" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn btn-login mt-2">
              Log in
          </button>
      </form>

      <!-- Signup link -->
      <div class="text-center mt-3 signup-text">
          Don’t have an account?
          <a href="{% url 'User_Login:signup' %}">Sign up</a>
      </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
