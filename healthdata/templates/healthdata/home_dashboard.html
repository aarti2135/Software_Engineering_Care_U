{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard · CareU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      width: 400px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
    }
    h2 {
      font-weight: 600;
      margin-bottom: 20px;
    }
    a.btn {
      margin: 10px 0;
      width: 100%;
      border-radius: 8px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome, {{ request.user.username|title }} 👋</h2>
    <p class="mb-4">Choose a section to explore:</p>

    <a href="{% url 'nutrition_dashboard' %}" class="btn btn-light text-primary">🍎 Nutrition Dashboard</a>
    <a href="{% url 'reminders_dashboard' %}" class="btn btn-light text-primary">🔔 Reminders</a>
    <a href="#" class="btn btn-outline-light disabled">🎯 Goals (Coming Soon)</a>
    <a href="{% url 'pro_alerts_list' %}" class="btn btn-outline-light">🤖 AI & Proactive Features</a>

    <hr class="text-white my-4">
    <a href="{% url 'User_Login:logout' %}" class="btn btn-outline-light">Logout</a>
  </div>
</body>
</html>
