<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ action }} Goal · CareU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f6f8fb; font-family: 'Inter', sans-serif; }
    .card { border:0; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="card mx-auto" style="max-width:600px;">
    <div class="card-body">
      <h4 class="fw-bold mb-3">{{ action }} Goal</h4>
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">{{ action }}</button>
      </form>
      <a href="{% url 'goal_dashboard' %}" class="d-block mt-3 text-center small text-muted">← Back to goals</a>
    </div>
  </div>
</div>
</body>
</html>
