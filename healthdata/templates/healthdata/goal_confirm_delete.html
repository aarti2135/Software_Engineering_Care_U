<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Delete Goal · CareU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card mx-auto shadow-sm" style="max-width:500px;">
      <div class="card-body text-center">
        <h5 class="fw-semibold mb-3">Delete Goal</h5>
        <p>Are you sure you want to delete the goal "<strong>{{ goal.title }}</strong>"?</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'goal_dashboard' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
